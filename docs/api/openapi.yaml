openapi: 3.1.0
info:
  title: CartSync API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Versioned synchronization and connectivity-required Household commands for
    the CartSync MVP. Checkpoint pulls are authoritative; SSE events are hints.
servers:
  - url: https://api.cartsync.example/api/v1
    description: Placeholder production origin
security:
  - bearerAuth: []
tags:
  - name: Synchronization
    description: Local-first operation upload, bootstrap, pull, and event hints.
  - name: History
    description: Online access to Completed Trips outside the automatic window.
  - name: Household
    description: Connectivity-required Household administration commands.
  - name: Account
    description: Account identity, privacy, session, and deletion commands.
  - name: Security
    description: Trusted-installation authorization and active incident notices.
paths:
  /sync/operations:
    post:
      tags: [Synchronization]
      operationId: submitOperations
      summary: Submit ordered local operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationBatchRequest'
      responses:
        '200':
          description: Every operation has an independent outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sync/bootstrap:
    get:
      tags: [Synchronization]
      operationId: getBootstrapPage
      summary: Page the authorized automatic synchronization scope
      parameters:
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: >-
            A bootstrap page. The final page includes a terminal Household
            cursor and marks the scope as available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sync/changes:
    get:
      tags: [Synchronization]
      operationId: getChanges
      summary: Pull canonical changes after a Household cursor
      parameters:
        - name: after
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Canonical deltas and the next cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '409':
          description: The cursor is no longer retained; bootstrap is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sync/events:
    get:
      tags: [Synchronization]
      operationId: streamSyncEvents
      summary: Receive checkpoint and affected-scope hints
      responses:
        '200':
          description: >-
            Server-sent events. Each `checkpoint` event contains a JSON
            CheckpointEvent. Clients must pull `/sync/changes` to obtain data.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /completed-trips:
    get:
      tags: [History]
      operationId: getOlderCompletedTrips
      summary: Page Completed Trips outside the automatic 90-day window
      parameters:
        - name: completedBefore
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Session-only older history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedTripPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /household/invitations:
    post:
      tags: [Household]
      operationId: createHouseholdInvitation
      summary: Invite an email address to the current Household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvitation'
        '403':
          $ref: '#/components/responses/OwnerRequired'
  /household/invitations/{invitationId}:
    delete:
      tags: [Household]
      operationId: revokeHouseholdInvitation
      summary: Revoke a Household Invitation
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Invitation revoked or already inactive.
        '403':
          $ref: '#/components/responses/OwnerRequired'
  /household/invitations/{invitationId}/resend:
    post:
      tags: [Household]
      operationId: resendHouseholdInvitation
      summary: Resend and refresh an active Household Invitation
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation delivery restarted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvitation'
        '403':
          $ref: '#/components/responses/OwnerRequired'
  /household/invitations/accept:
    post:
      tags: [Household]
      operationId: acceptHouseholdInvitation
      summary: Accept an Invitation using its single-use secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Membership created and the raw target email removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            Invitation is invalid or inactive, its verified email does not
            match, or the Account already belongs to a Household.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /household/membership:
    patch:
      tags: [Household]
      operationId: updateCurrentMemberAlias
      summary: Change the current member's Household alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberAliasRequest'
      responses:
        '200':
          description: Alias changed across visible attribution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdMembership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The normalized alias is already reserved.
  /household/members/{memberId}/remove:
    post:
      tags: [Household]
      operationId: removeHouseholdMember
      summary: Remove a member and revoke future Household access
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '202':
          description: Removal accepted; cached-data purge follows security policy.
        '403':
          $ref: '#/components/responses/OwnerRequired'
  /household/ownership-transfers:
    post:
      tags: [Household]
      operationId: createOwnershipTransfer
      summary: Offer Household ownership to another member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnershipTransferRequest'
      responses:
        '201':
          description: Ownership transfer awaits recipient acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransfer'
        '403':
          $ref: '#/components/responses/OwnerRequired'
  /household/ownership-transfers/{transferId}/accept:
    post:
      tags: [Household]
      operationId: acceptOwnershipTransfer
      summary: Accept a pending ownership transfer
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
      responses:
        '204':
          description: Ownership transferred; the former owner remains a member.
        '409':
          description: Transfer is expired, revoked, or addressed to another member.
  /household:
    delete:
      tags: [Household]
      operationId: deleteHousehold
      summary: Begin owner-authorized Household deletion
      responses:
        '202':
          description: Deletion accepted under the configured retention policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
        '403':
          $ref: '#/components/responses/OwnerRequired'
        '428':
          $ref: '#/components/responses/FreshAuthenticationRequired'
  /household/deletion/restore:
    post:
      tags: [Household]
      operationId: restoreHousehold
      summary: Restore the former Owner's quarantined Household
      responses:
        '200':
          description: Memberships restored; sessions and Invitations stay revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '428':
          $ref: '#/components/responses/FreshAuthenticationRequired'
        '409':
          description: No restorable Household exists or quarantine has expired.
  /household/export:
    get:
      tags: [Household]
      operationId: exportHouseholdData
      summary: Stream the Owner's shared Household data export
      responses:
        '200':
          description: Direct JSON export; no server-side export file is retained.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdExport'
        '403':
          $ref: '#/components/responses/OwnerRequired'
  /account/installations/lease:
    post:
      tags: [Security]
      operationId: issueTrustedInstallationLease
      summary: Issue or renew a Trusted Device's offline authorization lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallationLeaseRequest'
      responses:
        '200':
          description: Signed rolling 30-day lease after membership validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationLease'
        '403':
          $ref: '#/components/responses/Forbidden'
  /account/policy-acceptances:
    post:
      tags: [Account]
      operationId: acceptPolicies
      summary: Record terms, privacy, and adult-attestation acceptance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAcceptanceRequest'
      responses:
        '204':
          description: Policy versions accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account/sessions/revoke-all:
    post:
      tags: [Account]
      operationId: revokeAllSessions
      summary: Revoke all online sessions and future lease renewal
      responses:
        '200':
          description: All sessions revoked; disconnected leases expire naturally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account/export:
    get:
      tags: [Account]
      operationId: exportAccountData
      summary: Stream the current Account's privacy export
      responses:
        '200':
          description: Direct JSON export; no server-side export file is retained.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account:
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Begin the current Account's deletion quarantine
      responses:
        '202':
          description: Access revoked and 30-day deletion quarantine started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
        '428':
          $ref: '#/components/responses/FreshAuthenticationRequired'
        '409':
          description: A Household Owner must transfer ownership or delete it first.
  /account/deletion/restore:
    post:
      tags: [Account]
      operationId: restoreAccount
      summary: Restore the current Account during deletion quarantine
      responses:
        '200':
          description: Account restored; membership returns unless revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
        '428':
          $ref: '#/components/responses/FreshAuthenticationRequired'
        '409':
          description: The Account is not recoverable or quarantine has expired.
  /account/email-change/challenges:
    post:
      tags: [Account]
      operationId: createEmailChangeChallenge
      summary: Verify the current email and challenge a new email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailChangeChallengeRequest'
      responses:
        '201':
          description: Single-use code sent to the new email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '428':
          $ref: '#/components/responses/FreshAuthenticationRequired'
        '409':
          description: The normalized new email is already in use.
  /account/email-change/confirmations:
    post:
      tags: [Account]
      operationId: confirmEmailChange
      summary: Confirm the new email and replace the External ID identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChangeRequest'
      responses:
        '204':
          description: Email changed and existing sessions and leases revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Challenge is invalid, expired, consumed, or out of attempts.
  /account/security-notices:
    get:
      tags: [Security]
      operationId: getActiveSecurityNotices
      summary: Get active incident notices affecting the Account
      responses:
        '200':
          description: Active notices only; this is not a security-activity log.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecurityNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account/security-notices/{noticeId}/acknowledge:
    post:
      tags: [Security]
      operationId: acknowledgeSecurityNotice
      summary: Acknowledge an active incident notice
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '204':
          description: Notice acknowledged.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageToken:
      name: pageToken
      in: query
      required: false
      schema:
        type: [string, 'null']
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
  responses:
    Unauthorized:
      description: Authentication is missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The Account is not authorized. Machine-readable codes tell the client
        when locally retained Household data must be purged immediately.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccessProblem'
    OwnerRequired:
      description: The current member is not the Household Owner.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    FreshAuthenticationRequired:
      description: A hosted email-code sign-in completed within five minutes is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    OperationBatchRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OperationEnvelope'
    OperationEnvelope:
      type: object
      additionalProperties: false
      required:
        - operationId
        - operationVersion
        - installationId
        - deviceSequence
        - lastAppliedHouseholdCursor
        - kind
        - payload
      properties:
        operationId:
          $ref: '#/components/schemas/UuidV4'
        operationVersion:
          type: integer
          minimum: 1
        installationId:
          $ref: '#/components/schemas/UuidV4'
        deviceSequence:
          type: integer
          format: int64
          minimum: 1
        lastAppliedHouseholdCursor:
          type: integer
          format: int64
          minimum: 0
        kind:
          $ref: '#/components/schemas/OperationKind'
        payload:
          description: Payload schema must match `kind`.
          oneOf:
            - $ref: '#/components/schemas/NamedEntityPayload'
            - $ref: '#/components/schemas/EntityIdPayload'
            - $ref: '#/components/schemas/ProductNotePayload'
            - $ref: '#/components/schemas/StoreProductPlacementPayload'
            - $ref: '#/components/schemas/DepartmentMovePayload'
            - $ref: '#/components/schemas/TripCreatePayload'
            - $ref: '#/components/schemas/CarryForwardPayload'
            - $ref: '#/components/schemas/TripEntryAddPayload'
            - $ref: '#/components/schemas/TripEntryPatchPayload'
            - $ref: '#/components/schemas/TripEntryAcquiredPayload'
            - $ref: '#/components/schemas/CompletedTripCorrectionPayload'
            - $ref: '#/components/schemas/SyncIssueResolutionPayload'
    OperationKind:
      type: string
      enum:
        - store.create
        - store.rename
        - store.archive
        - store.restore
        - product.create
        - product.rename
        - product.archive
        - product.restore
        - product.note.set
        - store_product.place
        - store_product.remove
        - department.create
        - department.rename
        - department.move
        - department.remove
        - trip.create
        - trip.rename
        - trip.discard
        - trip.complete
        - trip.carry_forward
        - trip_entry.add
        - trip_entry.update
        - trip_entry.remove
        - trip_entry.set_acquired
        - completed_trip.correct_entry
        - sync_issue.resolve
    NamedEntityPayload:
      type: object
      additionalProperties: false
      required: [entityId, name]
      properties:
        entityId:
          $ref: '#/components/schemas/UuidV7'
        name:
          type: string
          minLength: 1
          maxLength: 200
    EntityIdPayload:
      type: object
      additionalProperties: false
      required: [entityId]
      properties:
        entityId:
          $ref: '#/components/schemas/UuidV7'
    ProductNotePayload:
      type: object
      additionalProperties: false
      required: [productId, note]
      properties:
        productId:
          $ref: '#/components/schemas/UuidV7'
        note:
          type: string
          maxLength: 1000
    StoreProductPlacementPayload:
      type: object
      additionalProperties: false
      required: [storeId, productId]
      properties:
        storeId:
          $ref: '#/components/schemas/UuidV7'
        productId:
          $ref: '#/components/schemas/UuidV7'
        departmentId:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
    DepartmentMovePayload:
      type: object
      additionalProperties: false
      required: [departmentId]
      properties:
        departmentId:
          $ref: '#/components/schemas/UuidV7'
        beforeDepartmentId:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
    TripCreatePayload:
      type: object
      additionalProperties: false
      required: [tripId, storeId, name]
      properties:
        tripId:
          $ref: '#/components/schemas/UuidV7'
        storeId:
          $ref: '#/components/schemas/UuidV7'
        name:
          type: string
          minLength: 1
          maxLength: 200
        plannedFor:
          type: [string, 'null']
          format: date
    CarryForwardPayload:
      type: object
      additionalProperties: false
      required: [sourceTripId, destinationTripId, productIds]
      properties:
        sourceTripId:
          $ref: '#/components/schemas/UuidV7'
        destinationTripId:
          $ref: '#/components/schemas/UuidV7'
        productIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UuidV7'
    TripEntryAddPayload:
      type: object
      additionalProperties: false
      required: [tripId, tripEntryId, productId, amount, unit]
      properties:
        tripId:
          $ref: '#/components/schemas/UuidV7'
        tripEntryId:
          $ref: '#/components/schemas/UuidV7'
        productId:
          $ref: '#/components/schemas/UuidV7'
        amount:
          type: number
          format: decimal
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/Unit'
        departmentId:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
    TripEntryPatchPayload:
      type: object
      additionalProperties: false
      required: [tripId, tripEntryId]
      properties:
        tripId:
          $ref: '#/components/schemas/UuidV7'
        tripEntryId:
          $ref: '#/components/schemas/UuidV7'
        amount:
          type: number
          format: decimal
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/Unit'
        departmentId:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
    TripEntryAcquiredPayload:
      type: object
      additionalProperties: false
      required: [tripId, tripEntryId, acquired]
      properties:
        tripId:
          $ref: '#/components/schemas/UuidV7'
        tripEntryId:
          $ref: '#/components/schemas/UuidV7'
        acquired:
          type: boolean
    CompletedTripCorrectionPayload:
      type: object
      additionalProperties: false
      required: [tripId, tripEntryId, correction]
      properties:
        tripId:
          $ref: '#/components/schemas/UuidV7'
        tripEntryId:
          $ref: '#/components/schemas/UuidV7'
        correction:
          $ref: '#/components/schemas/TripEntryPatchPayload'
    SyncIssueResolutionPayload:
      type: object
      additionalProperties: false
      required: [syncIssueId, action]
      properties:
        syncIssueId:
          $ref: '#/components/schemas/UuidV7'
        action:
          type: string
          enum: [restore, apply_as_new, review, discard]
        replacementOperation:
          oneOf:
            - $ref: '#/components/schemas/OperationEnvelope'
            - type: 'null'
    Unit:
      type: string
      enum: [each, pack, g, kg, oz, lb, mL, L, 'fl oz', gal]
    OperationBatchResponse:
      type: object
      additionalProperties: false
      required: [results, nextHouseholdCursor]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OperationOutcome'
        nextHouseholdCursor:
          type: integer
          format: int64
          minimum: 0
    OperationOutcome:
      type: object
      additionalProperties: false
      required: [operationId, status, householdCursor]
      properties:
        operationId:
          $ref: '#/components/schemas/UuidV4'
        status:
          type: string
          enum: [accepted, coalesced, already_applied, needs_attention]
        householdCursor:
          type: integer
          format: int64
          minimum: 0
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/IdentityAlias'
        syncIssue:
          oneOf:
            - $ref: '#/components/schemas/SyncIssueProjection'
            - type: 'null'
    BootstrapPage:
      type: object
      additionalProperties: false
      required: [projections, aliases, syncIssues, terminal, terminalHouseholdCursor, nextPageToken]
      properties:
        projections:
          type: array
          items:
            $ref: '#/components/schemas/Projection'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/IdentityAlias'
        syncIssues:
          type: array
          items:
            $ref: '#/components/schemas/SyncIssueProjection'
        terminal:
          type: boolean
        terminalHouseholdCursor:
          type: [integer, 'null']
          format: int64
          minimum: 0
        nextPageToken:
          type: [string, 'null']
    ChangePage:
      type: object
      additionalProperties: false
      required: [changes, nextHouseholdCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalChange'
        nextHouseholdCursor:
          type: integer
          format: int64
          minimum: 0
        hasMore:
          type: boolean
    CanonicalChange:
      type: object
      additionalProperties: false
      required: [householdCursor, changeKind, entityType, entityId, attribution]
      properties:
        householdCursor:
          type: integer
          format: int64
          minimum: 1
        changeKind:
          type: string
          enum: [upsert, tombstone, alias, sync_issue_upsert, sync_issue_resolved]
        entityType:
          type: string
          enum: [store, product, store_product, department, trip, trip_entry, sync_issue]
        entityId:
          $ref: '#/components/schemas/UuidV7'
        projection:
          oneOf:
            - $ref: '#/components/schemas/Projection'
            - type: 'null'
        tombstone:
          oneOf:
            - $ref: '#/components/schemas/Tombstone'
            - type: 'null'
        alias:
          oneOf:
            - $ref: '#/components/schemas/IdentityAlias'
            - type: 'null'
        fieldVersions:
          type: array
          items:
            $ref: '#/components/schemas/FieldVersion'
        attribution:
          $ref: '#/components/schemas/Attribution'
    Projection:
      oneOf:
        - $ref: '#/components/schemas/StoreProjection'
        - $ref: '#/components/schemas/ProductProjection'
        - $ref: '#/components/schemas/StoreProductProjection'
        - $ref: '#/components/schemas/DepartmentProjection'
        - $ref: '#/components/schemas/TripProjection'
        - $ref: '#/components/schemas/TripEntryProjection'
    ProjectionBase:
      type: object
      required: [id, householdCursor]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        householdCursor:
          type: integer
          format: int64
          minimum: 0
    StoreProjection:
      allOf:
        - $ref: '#/components/schemas/ProjectionBase'
        - type: object
          required: [name, archived]
          properties:
            name: { type: string }
            archived: { type: boolean }
            address: { type: [string, 'null'] }
    ProductProjection:
      allOf:
        - $ref: '#/components/schemas/ProjectionBase'
        - type: object
          required: [name, note, archived]
          properties:
            name: { type: string }
            note: { type: string }
            archived: { type: boolean }
    StoreProductProjection:
      allOf:
        - $ref: '#/components/schemas/ProjectionBase'
        - type: object
          required: [storeId, productId]
          properties:
            storeId: { $ref: '#/components/schemas/UuidV7' }
            productId: { $ref: '#/components/schemas/UuidV7' }
            departmentId:
              oneOf:
                - $ref: '#/components/schemas/UuidV7'
                - type: 'null'
    DepartmentProjection:
      allOf:
        - $ref: '#/components/schemas/ProjectionBase'
        - type: object
          required: [storeId, name, orderKey]
          properties:
            storeId: { $ref: '#/components/schemas/UuidV7' }
            name: { type: string }
            orderKey: { type: string }
    TripProjection:
      allOf:
        - $ref: '#/components/schemas/ProjectionBase'
        - type: object
          required: [storeId, name, state]
          properties:
            storeId: { $ref: '#/components/schemas/UuidV7' }
            name: { type: string }
            state: { type: string, enum: [planned, completed, discarded] }
            plannedFor: { type: [string, 'null'], format: date }
            completedAt: { type: [string, 'null'], format: date-time }
    TripEntryProjection:
      allOf:
        - $ref: '#/components/schemas/ProjectionBase'
        - type: object
          required: [tripId, productId, amount, unit, acquired]
          properties:
            tripId: { $ref: '#/components/schemas/UuidV7' }
            productId: { $ref: '#/components/schemas/UuidV7' }
            amount: { type: number, format: decimal, exclusiveMinimum: 0 }
            unit: { $ref: '#/components/schemas/Unit' }
            acquired: { type: boolean }
            departmentId:
              oneOf:
                - $ref: '#/components/schemas/UuidV7'
                - type: 'null'
            completedProductNameSnapshot: { type: [string, 'null'] }
            completedDepartmentNameSnapshot: { type: [string, 'null'] }
    FieldVersion:
      type: object
      additionalProperties: false
      required: [field, baseCursor, installationId, deviceSequence, operationId]
      properties:
        field: { type: string }
        baseCursor: { type: integer, format: int64, minimum: 0 }
        installationId: { $ref: '#/components/schemas/UuidV4' }
        deviceSequence: { type: integer, format: int64, minimum: 1 }
        operationId: { $ref: '#/components/schemas/UuidV4' }
    IdentityAlias:
      type: object
      additionalProperties: false
      required: [entityType, aliasId, canonicalId]
      properties:
        entityType: { type: string }
        aliasId: { $ref: '#/components/schemas/UuidV7' }
        canonicalId: { $ref: '#/components/schemas/UuidV7' }
    Tombstone:
      type: object
      additionalProperties: false
      required: [entityType, entityId, removedAtCursor]
      properties:
        entityType: { type: string }
        entityId: { $ref: '#/components/schemas/UuidV7' }
        removedAtCursor: { type: integer, format: int64, minimum: 1 }
    SyncIssueProjection:
      type: object
      additionalProperties: false
      required: [id, operationId, reason, actions, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        operationId: { $ref: '#/components/schemas/UuidV4' }
        reason: { type: string }
        context: { type: object, additionalProperties: true }
        actions:
          type: array
          items: { type: string, enum: [restore, apply_as_new, review, discard] }
        createdAt: { type: string, format: date-time }
    Attribution:
      type: object
      additionalProperties: false
      required: [memberId, changedAt]
      properties:
        memberId: { $ref: '#/components/schemas/UuidV7' }
        changedAt: { type: string, format: date-time }
    CompletedTripPage:
      type: object
      additionalProperties: false
      required: [trips, nextPageToken]
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/TripProjection'
        nextPageToken: { type: [string, 'null'] }
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, memberAlias]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Base64url-encoded 256-bit single-use secret.
        memberAlias:
          $ref: '#/components/schemas/MemberAlias'
    UpdateMemberAliasRequest:
      type: object
      additionalProperties: false
      required: [memberAlias]
      properties:
        memberAlias:
          $ref: '#/components/schemas/MemberAlias'
    MemberAlias:
      type: string
      minLength: 1
      maxLength: 80
      description: >-
        Display form; the server enforces Household-scoped uniqueness using the
        shared normalized-name algorithm.
    HouseholdMembership:
      type: object
      additionalProperties: false
      required: [id, householdId, memberAlias, role, status]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        householdId: { $ref: '#/components/schemas/UuidV7' }
        memberAlias: { $ref: '#/components/schemas/MemberAlias' }
        role: { type: string, enum: [owner, member] }
        status: { type: string, enum: [active, deletion_suspended] }
    InstallationLeaseRequest:
      type: object
      additionalProperties: false
      required: [installationId]
      properties:
        installationId: { $ref: '#/components/schemas/UuidV4' }
    InstallationLease:
      type: object
      additionalProperties: false
      required: [token, issuedAt, expiresAt, serverTime]
      properties:
        token:
          type: string
          description: Signed opaque authorization lease stored by a Trusted Device.
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
    PolicyAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [termsVersion, privacyVersion, adultAttestation]
      properties:
        termsVersion: { type: string, minLength: 1 }
        privacyVersion: { type: string, minLength: 1 }
        adultAttestation: { type: boolean, enum: [true] }
    PolicyAcceptance:
      type: object
      additionalProperties: false
      required: [termsVersion, privacyVersion, adultAttestation, acceptedAt]
      properties:
        termsVersion: { type: string }
        privacyVersion: { type: string }
        adultAttestation: { type: boolean }
        acceptedAt: { type: string, format: date-time }
    SessionRevocation:
      type: object
      additionalProperties: false
      required: [revokedAt]
      properties:
        revokedAt: { type: string, format: date-time }
    DeletionStatus:
      type: object
      additionalProperties: false
      required: [resource, state]
      properties:
        resource: { type: string, enum: [account, household] }
        state: { type: string, enum: [active, deletion_quarantine] }
        quarantineEndsAt: { type: [string, 'null'], format: date-time }
        backupExpiryBy: { type: [string, 'null'], format: date-time }
    CreateEmailChangeChallengeRequest:
      type: object
      additionalProperties: false
      required: [newEmail]
      properties:
        newEmail: { type: string, format: email }
    EmailChangeChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt, attemptsRemaining]
      properties:
        challengeId: { $ref: '#/components/schemas/UuidV7' }
        expiresAt: { type: string, format: date-time }
        attemptsRemaining: { type: integer, minimum: 1, maximum: 5 }
    ConfirmEmailChangeRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { $ref: '#/components/schemas/UuidV7' }
        code: { type: string, pattern: '^\\d{6}$' }
    SecurityNotice:
      type: object
      additionalProperties: false
      required: [id, title, summary, affectedData, mitigations, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        title: { type: string }
        summary: { type: string }
        affectedData:
          type: array
          items: { type: string }
        mitigations:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    AccountExport:
      type: object
      additionalProperties: false
      required:
        - exportedAt
        - accountId
        - verifiedEmail
        - policyAcceptances
        - securityRecords
      properties:
        exportedAt: { type: string, format: date-time }
        accountId: { $ref: '#/components/schemas/UuidV7' }
        verifiedEmail: { type: string, format: email }
        membership:
          oneOf:
            - $ref: '#/components/schemas/HouseholdMembership'
            - type: 'null'
        policyAcceptances:
          type: array
          items: { $ref: '#/components/schemas/PolicyAcceptance' }
        securityRecords:
          type: array
          items:
            type: object
            additionalProperties: true
    HouseholdMemberExport:
      type: object
      additionalProperties: false
      required: [memberId, attribution, role, status]
      properties:
        memberId: { $ref: '#/components/schemas/UuidV7' }
        attribution: { type: string }
        role: { type: string, enum: [owner, member] }
        status: { type: string, enum: [active, deletion_suspended, former] }
    HouseholdExport:
      type: object
      additionalProperties: false
      required: [exportedAt, householdId, members, projections]
      properties:
        exportedAt: { type: string, format: date-time }
        householdId: { $ref: '#/components/schemas/UuidV7' }
        members:
          type: array
          items: { $ref: '#/components/schemas/HouseholdMemberExport' }
        projections:
          type: array
          items: { $ref: '#/components/schemas/Projection' }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    HouseholdInvitation:
      type: object
      additionalProperties: false
      required: [id, status, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        targetEmail: { type: [string, 'null'], format: email }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
    CreateOwnershipTransferRequest:
      type: object
      additionalProperties: false
      required: [recipientMemberId]
      properties:
        recipientMemberId: { $ref: '#/components/schemas/UuidV7' }
    OwnershipTransfer:
      type: object
      additionalProperties: false
      required: [id, recipientMemberId, status, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        recipientMemberId: { $ref: '#/components/schemas/UuidV7' }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: [string, 'null'] }
        traceId: { type: [string, 'null'] }
    AccessProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - forbidden
                - membership_revoked
                - account_deletion_pending
                - account_deleted
                - household_deletion_pending
                - household_deleted
