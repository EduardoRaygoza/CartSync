name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:openapi
      - run: npm run build:web
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: dotnet restore CartSync.slnx
      - run: dotnet build CartSync.slnx --configuration Release --no-restore
      - run: dotnet test --project tests/server/CartSync.Api.Tests/CartSync.Api.Tests.csproj --configuration Release --no-build
      - name: Reject ASP.NET contract drift
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5099
          Cors__AllowedOrigin: https://pwa.example
        run: |
          mkdir -p artifacts/generated
          dotnet run --project src/server/CartSync.Api/CartSync.Api.csproj --configuration Release --no-build --no-launch-profile &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5099/openapi/v1.json --output artifacts/generated/aspnet-openapi.json; then
              break
            fi
            sleep 1
          done
          test -s artifacts/generated/aspnet-openapi.json
          npm ci --ignore-scripts
          npm run verify:aspnet-contract -- artifacts/generated/aspnet-openapi.json

  database:
    name: Database isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet test --project tests/server/CartSync.Database.Tests/CartSync.Database.Tests.csproj --configuration Release

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/cli@d4515bc8e518874d3c814bf5c307a1cb08ec9b35 # v2
        with:
          inlineScript: |
            az bicep build --file infra/bootstrap.bicep
            az bicep build --file infra/platform.bicep
            az bicep build --file infra/release.bicep
            ! grep -RE "AllowAllWindowsAzureIps|0\.0\.0\.0.*0\.0\.0\.0" infra --include='*.bicep'
            ! grep -RE "adminUserEnabled: true" infra --include='*.bicep'

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/server/CartSync.Api/Dockerfile
          push: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/server/CartSync.DatabaseMigrator/Dockerfile
          push: false

  required:
    name: CI / required
    if: always()
    needs: [web, server, database, infrastructure, containers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          test "$(jq -r '[.[].result] | all(. == "success")' <<<"$RESULTS")" = "true"
