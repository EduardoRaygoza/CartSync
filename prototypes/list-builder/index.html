<!doctype html>
<!-- Three list-building variants, switchable via ?variant=, on a throwaway prototype route. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CartSync — list builder prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16211d;
      --muted: #66736d;
      --line: #dce4df;
      --paper: #fffefa;
      --wash: #f2f6f1;
      --green: #176b4d;
      --green-2: #dff3e8;
      --amber: #f3bb53;
      --danger: #a33b31;
      --shadow: 0 14px 36px rgba(22, 33, 29, .12);
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--wash); min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(23, 107, 77, .28); outline-offset: 2px; }
    .shell { width: min(1120px, 100%); margin: 0 auto; min-height: 100vh; padding: 18px 16px 130px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .brand-mark { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; }
    .logo { display: grid; place-items: center; width: 38px; height: 38px; color: white; background: var(--green); border-radius: 12px; }
    .prototype-tag { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(27px, 6vw, 46px); line-height: 1.04; letter-spacing: -.04em; margin-bottom: 10px; }
    h2 { font-size: 21px; letter-spacing: -.02em; }
    h3 { font-size: 16px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 4px 18px rgba(22, 33, 29, .05); }
    .pad { padding: 18px; }
    .btn { min-height: 44px; border: 1px solid var(--line); border-radius: 13px; padding: 10px 15px; background: white; color: var(--ink); font-weight: 750; }
    .btn:hover { border-color: #aebbb4; }
    .btn.primary { color: white; border-color: var(--green); background: var(--green); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.danger { color: var(--danger); }
    .btn.block { width: 100%; }
    .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: white; font-weight: 900; }
    .field { display: grid; gap: 7px; }
    .field label, .label { font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: .02em; }
    input, select, textarea { width: 100%; min-height: 46px; border: 1px solid #bcc9c2; border-radius: 12px; padding: 11px 12px; color: var(--ink); background: white; }
    textarea { min-height: 82px; resize: vertical; }
    .search { position: relative; }
    .search input { padding-left: 42px; font-size: 16px; }
    .search::before { content: "⌕"; position: absolute; left: 14px; top: 8px; font-size: 24px; color: var(--muted); z-index: 1; }
    .grid { display: grid; gap: 14px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .spread { justify-content: space-between; }
    .stack { display: grid; gap: 10px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 5px 10px; border-radius: 99px; color: #3e4b45; background: #edf2ee; font-size: 12px; font-weight: 700; }
    .pill.green { color: #0d5b3f; background: var(--green-2); }
    .setup { width: min(680px, 100%); margin: 5vh auto 0; }
    .setup-hero { padding: 24px; background: linear-gradient(145deg, #fffefa, #e9f5ed); }
    .store-options { display: grid; gap: 10px; margin: 18px 0; }
    .store-option { display: flex; text-align: left; width: 100%; padding: 15px; border: 2px solid transparent; border-radius: 15px; background: white; box-shadow: 0 2px 10px rgba(22,33,29,.05); }
    .store-option.selected { border-color: var(--green); background: #f5fbf7; }
    .store-option strong { display: block; margin-bottom: 3px; }
    .trip-head { margin-bottom: 16px; }
    .trip-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .results { display: grid; gap: 8px; }
    .result { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .result strong { display: block; }
    .result-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .entry { border: 1px solid var(--line); border-radius: 15px; background: white; overflow: clip; scroll-margin: 90px; }
    .entry.focused { animation: focusPulse 1.1s ease; }
    @keyframes focusPulse { 0%, 100% { box-shadow: none; } 45% { box-shadow: 0 0 0 5px rgba(243,187,83,.42); } }
    .entry-main { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 13px; }
    .entry-editor { border-top: 1px solid var(--line); padding: 14px; background: #fbfcfa; }
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .editor-grid .wide { grid-column: 1 / -1; }
    .save-state { color: var(--green); font-size: 12px; font-weight: 750; min-height: 18px; }
    .empty { padding: 24px; border: 1px dashed #aebbb4; border-radius: 15px; text-align: center; background: rgba(255,255,255,.55); }
    .composer-grid { display: grid; gap: 16px; }
    .composer-discovery, .composer-trip { padding: 17px; }
    .section-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .split-frame { overflow: clip; }
    .split-top { padding: 16px; background: #173c32; color: white; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 14px; background: rgba(255,255,255,.14); }
    .tab { min-height: 42px; border: 0; border-radius: 10px; color: white; background: transparent; font-weight: 800; }
    .tab.active { color: var(--ink); background: white; }
    .split-content { padding: 16px; min-height: 560px; background: var(--paper); }
    .catalog-table .result { border-width: 0 0 1px; border-radius: 0; padding-inline: 2px; }
    .trip-first { display: grid; gap: 14px; }
    .trip-first-hero { padding: 20px; color: white; background: linear-gradient(145deg, #143f32, #287a59); border-radius: 22px; }
    .trip-first-list { padding: 15px; }
    .floating-add { position: fixed; right: 18px; bottom: 92px; z-index: 25; min-height: 54px; padding: 0 20px; border: 0; border-radius: 99px; color: white; background: var(--green); box-shadow: var(--shadow); font-weight: 850; }
    .overlay { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto 1fr; background: var(--wash); }
    .overlay-head { padding: 14px 16px; background: white; border-bottom: 1px solid var(--line); }
    .overlay-body { padding: 16px; overflow: auto; }
    .sheet-backdrop { position: fixed; inset: 0; z-index: 41; background: rgba(14,24,20,.45); }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 42; max-height: 88vh; overflow: auto; padding: 18px 16px 110px; border-radius: 24px 24px 0 0; background: white; box-shadow: var(--shadow); }
    .state-panel { margin-top: 22px; }
    .state-panel summary { cursor: pointer; padding: 13px 16px; font-weight: 800; }
    .state-panel pre { margin: 0; padding: 16px; overflow: auto; border-top: 1px solid var(--line); color: #d7f7e7; background: #10251e; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .switcher { position: fixed; left: 50%; bottom: 20px; z-index: 80; display: grid; grid-template-columns: 44px minmax(160px, auto) 44px; align-items: center; transform: translateX(-50%); padding: 6px; border-radius: 99px; color: white; background: #101714; box-shadow: var(--shadow); }
    .switcher button { width: 40px; height: 40px; border: 0; border-radius: 50%; color: white; background: rgba(255,255,255,.11); font-size: 19px; }
    .switch-label { padding-inline: 10px; text-align: center; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .toast { position: fixed; left: 50%; bottom: 82px; z-index: 90; display: flex; align-items: center; gap: 12px; width: min(420px, calc(100% - 28px)); transform: translateX(-50%); padding: 13px 15px; border-radius: 14px; color: white; background: #26312c; box-shadow: var(--shadow); }
    .toast button { margin-left: auto; border: 0; color: #aeeccf; background: transparent; font-weight: 850; }
    .hidden { display: none !important; }
    @media (min-width: 760px) {
      .shell { padding-top: 28px; }
      .composer-grid { grid-template-columns: minmax(320px, .86fr) minmax(380px, 1.14fr); align-items: start; }
      .composer-discovery { position: sticky; top: 18px; }
      .split-frame { display: grid; grid-template-columns: 300px 1fr; min-height: 680px; }
      .split-top { padding: 24px; }
      .tabs { grid-template-columns: 1fr; margin-top: 30px; }
      .split-content { padding: 26px; }
      .trip-first { grid-template-columns: 330px 1fr; align-items: start; }
      .trip-first-hero { position: sticky; top: 18px; min-height: 420px; }
      .floating-add { position: static; width: 100%; margin-top: 28px; }
      .overlay { inset: 6vh max(8vw, calc((100vw - 1100px) / 2)); border-radius: 24px; overflow: clip; box-shadow: var(--shadow); }
      .sheet { left: auto; right: 24px; bottom: 24px; width: 440px; max-height: calc(100vh - 48px); border-radius: 24px; padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="toast" aria-live="polite"></div>
  <nav class="switcher" aria-label="Prototype variants" data-prototype-only>
    <button type="button" data-action="previous-variant" aria-label="Previous variant">←</button>
    <div class="switch-label" id="variant-label"></div>
    <button type="button" data-action="next-variant" aria-label="Next variant">→</button>
  </nav>

  <script>
    const units = ['each', 'pack', 'g', 'kg', 'oz', 'lb', 'mL', 'L', 'fl oz', 'gal'];
    const variantNames = { A: 'Composer', B: 'Split Workspace', C: 'Trip First' };
    const baseData = {
      products: [
        { id: 'p-milk', name: 'Milk 2%', note: 'Check the latest expiry date' },
        { id: 'p-eggs', name: 'Eggs', note: 'Free range if available' },
        { id: 'p-bananas', name: 'Bananas', note: '' },
        { id: 'p-oil', name: 'Olive oil', note: 'Extra virgin' },
        { id: 'p-coffee', name: 'Coffee beans', note: 'Medium roast' },
        { id: 'p-soap', name: 'Dish soap', note: 'Unscented' },
        { id: 'p-tomatoes', name: 'Tomatoes', note: '' }
      ],
      stores: [
        {
          id: 's-costco', label: 'Costco Downtown', subtitle: 'Established catalog · 5 reusable products',
          departments: [
            { id: 'd-produce', name: 'Produce', position: 1 },
            { id: 'd-dairy', name: 'Dairy & eggs', position: 2 },
            { id: 'd-pantry', name: 'Pantry', position: 3 },
            { id: 'd-household', name: 'Household', position: 4 }
          ],
          storeProducts: [
            { productId: 'p-milk', departmentId: 'd-dairy', score: 98 },
            { productId: 'p-eggs', departmentId: 'd-dairy', score: 94 },
            { productId: 'p-bananas', departmentId: 'd-produce', score: 88 },
            { productId: 'p-oil', departmentId: 'd-pantry', score: 71 },
            { productId: 'p-soap', departmentId: 'd-household', score: 65 }
          ]
        },
        {
          id: 's-freshmart', label: 'FreshMart West', subtitle: 'New Store · empty catalog',
          departments: [
            { id: 'd-fm-produce', name: 'Produce', position: 1 },
            { id: 'd-fm-pantry', name: 'Pantry', position: 2 }
          ],
          storeProducts: []
        }
      ]
    };

    const state = {
      data: structuredClone(baseData),
      variant: getVariant(),
      selectedStoreId: 's-costco',
      tripName: suggestedTripName('Costco Downtown'),
      trip: null,
      query: '',
      editingEntryId: null,
      focusedEntryId: null,
      splitTab: 'browse',
      addOverlay: false,
      lastRemoved: null,
      toast: null,
      saveMessage: ''
    };

    function getVariant() {
      const value = new URLSearchParams(location.search).get('variant') || 'A';
      return ['A', 'B', 'C'].includes(value) ? value : 'A';
    }
    function suggestedTripName(storeLabel) {
      const now = new Date();
      return `${storeLabel} · ${now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
    }
    function normalize(value) { return value.trim().replace(/\s+/g, ' ').toLocaleLowerCase(); }
    function esc(value = '') { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function currentStore() { return state.data.stores.find(store => store.id === (state.trip?.storeId || state.selectedStoreId)); }
    function product(id) { return state.data.products.find(item => item.id === id); }
    function storeProduct(productId) { return currentStore().storeProducts.find(item => item.productId === productId); }
    function departmentName(id) { return currentStore().departments.find(item => item.id === id)?.name || 'Unassigned'; }
    function entryForProduct(productId) { return state.trip?.entries.find(entry => entry.productId === productId); }
    function slug() { return Math.random().toString(36).slice(2, 9); }

    function appChrome(content) {
      return `<div class="shell">
        <header class="brand">
          <div class="brand-mark"><span class="logo">C</span><span>CartSync</span></div>
          <span class="prototype-tag">Throwaway prototype</span>
        </header>
        ${content}
        ${state.trip ? stateInspector() : ''}
      </div>`;
    }

    function renderSetup() {
      const options = state.data.stores.map(store => `<button type="button" class="store-option ${store.id === state.selectedStoreId ? 'selected' : ''}" data-action="select-store" data-store-id="${store.id}">
        <span><strong>${esc(store.label)}</strong><span class="muted small">${esc(store.subtitle)}</span></span>
      </button>`).join('');
      return appChrome(`<section class="setup card setup-hero">
        <p class="eyebrow">New planned trip</p>
        <h1>Where are you shopping?</h1>
        <p class="muted">Choose a Store, then keep or edit the suggested Trip name.</p>
        <div class="store-options">${options}</div>
        <form id="trip-setup" class="stack">
          <div class="field"><label for="trip-name">Trip name</label><input id="trip-name" name="tripName" value="${esc(state.tripName)}" required autocomplete="off"></div>
          <button class="btn primary block" type="submit">Create planned trip</button>
        </form>
      </section>`);
    }

    function tripHeader(compact = false) {
      return `<div class="trip-head">
        <p class="eyebrow">${esc(currentStore().label)}</p>
        <h1>${esc(state.trip.name)}</h1>
        <div class="trip-meta"><span class="pill green">${state.trip.entries.length} ${state.trip.entries.length === 1 ? 'product' : 'products'}</span><span class="pill">${compact ? 'Auto-save on' : 'Shared planned trip'}</span></div>
      </div>`;
    }

    function searchBox(id = 'product-search') {
      return `<div class="search"><input id="${id}" data-role="search" type="search" value="${esc(state.query)}" placeholder="Search or add a product" autocomplete="off" aria-label="Search or add a product"></div>`;
    }

    function discovery() {
      const store = currentStore();
      const query = normalize(state.query);
      if (!query) {
        if (!store.storeProducts.length) return `<div class="empty"><h3>Your Store Catalog is empty</h3><p class="muted small">Search for a household Product or type a new name to add the first one.</p></div>`;
        const recommended = [...store.storeProducts].sort((a,b) => b.score - a.score).slice(0, 5);
        return `<div class="results">${recommended.map(item => productResult(item.productId, 'Recent & frequent', true)).join('')}</div>`;
      }
      const local = store.storeProducts
        .map(item => product(item.productId))
        .filter(item => normalize(item.name).includes(query));
      const localIds = new Set(local.map(item => item.id));
      const household = state.data.products.filter(item => !localIds.has(item.id) && normalize(item.name).includes(query));
      const exact = state.data.products.some(item => normalize(item.name) === query);
      const sections = [];
      if (local.length) sections.push(`<div><p class="label">At ${esc(store.label)}</p><div class="results">${local.map(item => productResult(item.id, 'Store Product', true)).join('')}</div></div>`);
      if (household.length) sections.push(`<div><p class="label">Elsewhere in your household</p><div class="results">${household.map(item => productResult(item.id, 'Add to this Store', false)).join('')}</div></div>`);
      if (!exact) sections.push(`<button class="btn block" data-action="create-product" type="button">Create “${esc(state.query.trim())}”</button>`);
      if (!sections.length) sections.push(`<div class="empty"><p>No matching Products.</p></div>`);
      return `<div class="stack">${sections.join('')}</div>`;
    }

    function productResult(productId, badge, isLocal) {
      const item = product(productId);
      const association = storeProduct(productId);
      const existing = entryForProduct(productId);
      return `<div class="result">
        <div><strong>${esc(item.name)}</strong><div class="result-meta"><span class="pill">${esc(badge)}</span>${association ? `<span class="pill">${esc(departmentName(association.departmentId))}</span>` : ''}${item.note ? `<span class="muted small">${esc(item.note)}</span>` : ''}</div></div>
        <button type="button" class="btn ${existing ? '' : 'primary'}" data-action="add-product" data-product-id="${productId}" data-local="${isLocal}">${existing ? 'On trip' : 'Add'}</button>
      </div>`;
    }

    function entriesList(mode = 'inline') {
      if (!state.trip.entries.length) return `<div class="empty"><h3>No products yet</h3><p class="muted small">Use search or a recommendation to start building this Trip.</p></div>`;
      return `<div class="stack">${state.trip.entries.map(entry => entryCard(entry, mode)).join('')}</div>`;
    }

    function entryCard(entry, mode) {
      const item = product(entry.productId);
      const association = storeProduct(entry.productId);
      const isEditing = state.editingEntryId === entry.id;
      const isFocused = state.focusedEntryId === entry.id;
      const editorTarget = mode === 'sheet' ? 'open-entry-sheet' : 'toggle-entry';
      return `<article class="entry ${isFocused ? 'focused' : ''}" data-entry-id="${entry.id}">
        <div class="entry-main">
          <div><strong>${esc(item.name)}</strong><div class="result-meta"><span class="pill">${entry.amount} ${esc(entry.unit)}</span><span class="pill">${esc(departmentName(association?.departmentId))}</span>${item.note ? `<span class="muted small">${esc(item.note)}</span>` : ''}</div></div>
          <button type="button" class="btn" data-action="${editorTarget}" data-entry-id="${entry.id}">${isEditing && mode !== 'sheet' ? 'Done' : 'Edit'}</button>
        </div>
        ${isEditing && mode !== 'sheet' ? entryEditor(entry) : ''}
      </article>`;
    }

    function entryEditor(entry) {
      const item = product(entry.productId);
      const association = storeProduct(entry.productId);
      return `<div class="entry-editor">
        <div class="editor-grid">
          <div class="field"><label>Amount</label><input type="number" min="0.01" step="0.01" value="${entry.amount}" data-change="amount" data-entry-id="${entry.id}"></div>
          <div class="field"><label>Unit</label><select data-change="unit" data-entry-id="${entry.id}">${units.map(unit => `<option ${unit === entry.unit ? 'selected' : ''}>${unit}</option>`).join('')}</select></div>
          <div class="field wide"><label>Department at this Store</label><select data-change="department" data-entry-id="${entry.id}"><option value="">Unassigned</option>${currentStore().departments.map(dept => `<option value="${dept.id}" ${dept.id === association?.departmentId ? 'selected' : ''}>${esc(dept.name)}</option>`).join('')}</select></div>
          <div class="field wide"><label>Product note — used everywhere</label><textarea data-change="note" data-entry-id="${entry.id}">${esc(item.note)}</textarea><span class="muted small">Changing a non-empty note asks for confirmation because Completed Trips also update.</span></div>
          <div class="row spread wide"><span class="save-state">${esc(state.saveMessage)}</span><button type="button" class="btn danger ghost" data-action="remove-entry" data-entry-id="${entry.id}">Remove from trip</button></div>
        </div>
      </div>`;
    }

    function renderComposer() {
      return appChrome(`${tripHeader()}
        <div class="composer-grid">
          <section class="card composer-discovery"><div class="section-head"><div><h2>Add products</h2><p class="muted small">Store matches first, household Products second.</p></div></div>${searchBox()}<div style="height:12px"></div>${discovery()}</section>
          <section class="card composer-trip"><div class="section-head"><div><h2>Current trip</h2><p class="muted small">Tap Edit for quantity, placement, or the global note.</p></div></div>${entriesList('inline')}</section>
        </div>`);
    }

    function renderSplit() {
      const browse = `<div class="stack"><div><h2>Browse the Store Catalog</h2><p class="muted small">Rapidly add familiar Products or search the whole household.</p></div>${searchBox()}<div class="catalog-table">${discovery()}</div></div>`;
      const trip = `<div class="stack"><div><h2>${esc(state.trip.name)}</h2><p class="muted small">All changes save automatically.</p></div>${entriesList('inline')}</div>`;
      return appChrome(`<section class="card split-frame">
        <aside class="split-top"><p class="eyebrow" style="color:#99dfbd">${esc(currentStore().label)}</p><h2>${esc(state.trip.name)}</h2><p class="small" style="color:#c7ded4">Build from known Products without losing track of the Trip.</p>
          <div class="tabs"><button type="button" class="tab ${state.splitTab === 'browse' ? 'active' : ''}" data-action="set-tab" data-tab="browse">Browse</button><button type="button" class="tab ${state.splitTab === 'trip' ? 'active' : ''}" data-action="set-tab" data-tab="trip">Trip · ${state.trip.entries.length}</button></div>
        </aside>
        <div class="split-content">${state.splitTab === 'browse' ? browse : trip}</div>
      </section>`);
    }

    function renderTripFirst() {
      return appChrome(`<div class="trip-first">
        <section class="trip-first-hero"><p class="eyebrow" style="color:#a9e7c8">${esc(currentStore().label)}</p><h1>${esc(state.trip.name)}</h1><p style="color:#cce3d8">Keep the Trip visible. Open the catalog only when you need to add something.</p><div class="trip-meta"><span class="pill">${state.trip.entries.length} products</span><span class="pill">Auto-saved</span></div><button type="button" class="floating-add" data-action="open-overlay">＋ Add products</button></section>
        <section class="card trip-first-list"><div class="section-head"><div><h2>Your trip</h2><p class="muted small">Edit details in a focused sheet.</p></div></div>${entriesList('sheet')}</section>
      </div>
      ${state.addOverlay ? `<section class="overlay" role="dialog" aria-modal="true" aria-label="Add products"><header class="overlay-head row"><button type="button" class="icon-btn" data-action="close-overlay" aria-label="Close">×</button><div style="flex:1">${searchBox('overlay-search')}</div><span class="pill green">${state.trip.entries.length} added</span></header><div class="overlay-body"><h2>${state.query ? 'Search results' : 'Recent & frequent'}</h2>${discovery()}</div></section>` : ''}
      ${state.editingEntryId ? renderSheet() : ''}`);
    }

    function renderSheet() {
      const entry = state.trip.entries.find(item => item.id === state.editingEntryId);
      if (!entry) return '';
      return `<div class="sheet-backdrop" data-action="close-entry-sheet"></div><section class="sheet" role="dialog" aria-modal="true"><div class="row spread"><div><p class="eyebrow">Edit trip entry</p><h2>${esc(product(entry.productId).name)}</h2></div><button type="button" class="icon-btn" data-action="close-entry-sheet" aria-label="Close">×</button></div>${entryEditor(entry)}</section>`;
    }

    function stateInspector() {
      const visible = {
        variant: `${state.variant} — ${variantNames[state.variant]}`,
        store: { id: currentStore().id, label: currentStore().label, storeProducts: currentStore().storeProducts },
        trip: state.trip,
        products: state.data.products
      };
      return `<details class="card state-panel"><summary>Inspect prototype state</summary><pre>${esc(JSON.stringify(visible, null, 2))}</pre></details>`;
    }

    function render() {
      const app = document.querySelector('#app');
      if (!state.trip) app.innerHTML = renderSetup();
      else if (state.variant === 'A') app.innerHTML = renderComposer();
      else if (state.variant === 'B') app.innerHTML = renderSplit();
      else app.innerHTML = renderTripFirst();
      document.querySelector('#variant-label').textContent = `${state.variant} (${variantNames[state.variant]})`;
      renderToast();
      requestAnimationFrame(() => {
        if (state.focusedEntryId) {
          document.querySelector(`[data-entry-id="${state.focusedEntryId}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(() => { state.focusedEntryId = null; }, 1200);
        }
      });
    }

    function renderToast() {
      const node = document.querySelector('#toast');
      if (!state.toast) { node.innerHTML = ''; return; }
      node.innerHTML = `<div class="toast"><span>${esc(state.toast.message)}</span>${state.toast.undo ? '<button type="button" data-action="undo-remove">Undo</button>' : ''}</div>`;
    }

    function showToast(message, undo = false) {
      state.toast = { message, undo };
      renderToast();
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { state.toast = null; renderToast(); }, 4200);
    }

    function setVariant(next) {
      const values = ['A', 'B', 'C'];
      const current = values.indexOf(state.variant);
      state.variant = next === 'previous' ? values[(current + 2) % 3] : next === 'next' ? values[(current + 1) % 3] : next;
      const params = new URLSearchParams(location.search);
      params.set('variant', state.variant);
      history.replaceState({}, '', `${location.pathname}?${params}`);
      state.editingEntryId = null;
      state.addOverlay = false;
      render();
    }

    function addProduct(productId) {
      const existing = entryForProduct(productId);
      if (existing) {
        state.editingEntryId = existing.id;
        state.focusedEntryId = existing.id;
        state.addOverlay = false;
        state.splitTab = 'trip';
        showToast(`${product(productId).name} is already on this Trip`);
        render();
        return;
      }
      if (!storeProduct(productId)) currentStore().storeProducts.push({ productId, departmentId: null, score: 1 });
      const entry = { id: `e-${slug()}`, productId, amount: 1, unit: 'each', acquired: false };
      state.trip.entries.push(entry);
      state.query = '';
      state.focusedEntryId = entry.id;
      showToast(`${product(productId).name} added · 1 each`);
      render();
      requestAnimationFrame(() => document.querySelector('[data-role="search"]')?.focus());
    }

    function createProduct() {
      const name = state.query.trim().replace(/\s+/g, ' ');
      if (!name) return;
      const exact = state.data.products.find(item => normalize(item.name) === normalize(name));
      if (exact) return addProduct(exact.id);
      const item = { id: `p-${slug()}`, name, note: '' };
      state.data.products.push(item);
      currentStore().storeProducts.push({ productId: item.id, departmentId: null, score: 1 });
      addProduct(item.id);
      state.editingEntryId = entryForProduct(item.id)?.id || null;
      render();
    }

    function saveField(target) {
      const entry = state.trip.entries.find(item => item.id === target.dataset.entryId);
      if (!entry) return;
      const kind = target.dataset.change;
      if (kind === 'amount') entry.amount = Math.max(0.01, Number(target.value) || 1);
      if (kind === 'unit') entry.unit = target.value;
      if (kind === 'department') storeProduct(entry.productId).departmentId = target.value || null;
      if (kind === 'note') {
        const item = product(entry.productId);
        const next = target.value.trim();
        if (item.note && item.note !== next && !confirm('This Product note is used everywhere, including Completed Trips. Change it for the whole household?')) {
          render();
          return;
        }
        item.note = next;
      }
      state.saveMessage = 'Saving…';
      render();
      setTimeout(() => { state.saveMessage = 'Saved just now'; render(); }, 380);
    }

    document.addEventListener('submit', event => {
      if (event.target.id !== 'trip-setup') return;
      event.preventDefault();
      const name = new FormData(event.target).get('tripName').trim().replace(/\s+/g, ' ');
      if (!name) return;
      state.trip = { id: `t-${slug()}`, name, storeId: state.selectedStoreId, status: 'planned', entries: [] };
      render();
      requestAnimationFrame(() => document.querySelector('[data-role="search"]')?.focus());
    });

    document.addEventListener('input', event => {
      if (event.target.name === 'tripName') state.tripName = event.target.value;
      if (event.target.dataset.change === 'amount' && state.trip) {
        const entry = state.trip.entries.find(item => item.id === event.target.dataset.entryId);
        if (entry) {
          entry.amount = Math.max(0.01, Number(event.target.value) || 1);
          state.saveMessage = 'Saving…';
          clearTimeout(saveField.timer);
          saveField.timer = setTimeout(() => { state.saveMessage = 'Saved just now'; render(); }, 500);
        }
      }
      if (event.target.matches('[data-role="search"]')) {
        const position = event.target.selectionStart;
        state.query = event.target.value;
        render();
        const field = document.querySelector('[data-role="search"]');
        field?.focus();
        field?.setSelectionRange(position, position);
      }
    });

    document.addEventListener('change', event => {
      if (event.target.dataset.change) saveField(event.target);
    });

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'previous-variant') setVariant('previous');
      if (action === 'next-variant') setVariant('next');
      if (action === 'select-store') {
        state.selectedStoreId = target.dataset.storeId;
        state.tripName = suggestedTripName(currentStore().label);
        render();
      }
      if (action === 'add-product') addProduct(target.dataset.productId);
      if (action === 'create-product') createProduct();
      if (action === 'toggle-entry') { state.editingEntryId = state.editingEntryId === target.dataset.entryId ? null : target.dataset.entryId; render(); }
      if (action === 'set-tab') { state.splitTab = target.dataset.tab; render(); }
      if (action === 'open-overlay') { state.addOverlay = true; state.query = ''; render(); requestAnimationFrame(() => document.querySelector('[data-role="search"]')?.focus()); }
      if (action === 'close-overlay') { state.addOverlay = false; state.query = ''; render(); }
      if (action === 'open-entry-sheet') { state.editingEntryId = target.dataset.entryId; render(); }
      if (action === 'close-entry-sheet') { state.editingEntryId = null; render(); }
      if (action === 'remove-entry') {
        const index = state.trip.entries.findIndex(item => item.id === target.dataset.entryId);
        if (index >= 0) {
          state.lastRemoved = { entry: state.trip.entries[index], index };
          const name = product(state.trip.entries[index].productId).name;
          state.trip.entries.splice(index, 1);
          state.editingEntryId = null;
          render();
          showToast(`${name} removed from this Trip`, true);
        }
      }
      if (action === 'undo-remove' && state.lastRemoved) {
        state.trip.entries.splice(state.lastRemoved.index, 0, state.lastRemoved.entry);
        state.focusedEntryId = state.lastRemoved.entry.id;
        state.lastRemoved = null;
        state.toast = null;
        render();
      }
    });

    document.addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
      if (event.target.matches('input, textarea, select, [contenteditable]')) return;
      event.preventDefault();
      setVariant(event.key === 'ArrowLeft' ? 'previous' : 'next');
    });

    window.addEventListener('popstate', () => { state.variant = getVariant(); render(); });
    render();
  </script>
</body>
</html>
